name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=false&include_all_commits=true&count_private=false&disable_animations=false&theme=dark&locale=en&hide_border=true&bg_color=0D1117&title_color=C4B5FD&icon_color=8B5CF6&text_color=C9D1D9
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push stats.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
